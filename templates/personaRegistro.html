<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f4f4f4;
      }

      .container {
        background-color: #fff;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        width: 350px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      p {
        text-align: center;
        margin-bottom: 20px;
      }

      .social-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .social-button {
        padding: 12px 15px;
        border: none;
        border-radius: 5px;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .next-button {
        height: 50px;
        width: 200px;
        background-color: #004aad;
        color: white;
        font-size: 20px;
        border-radius: 10px;
        margin-left: 25%;
      }
      .back-button {
        font-size: 20px;
        color: black;
        background-color: white;
        border-color: #004aad;
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }
      .facebook-button {
        background-color: #3b5998;
      }

      .google-button {
        background-color: #dd4b39;
      }

      .twitter-button {
        background-color: #1da1f2;
      }

      .register-button {
        padding: 15px 25px;
        border: none;
        border-radius: 5px;
        background-color: #004aad;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
        margin-left: 35%;
      }

      .register-button:hover {
        background-color: #0069d9;
      }

      .social-button:hover {
        opacity: 0.8;
      }
      #social {
        margin-left: 0px;
      }
      h1 {
        text-align: center;
        background-color: #004aad;
        color: white;
        height: 50px;
        border-radius: 20px;
        padding-top: 5%;
      }
      .icon-container {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .icon {
        background-color: #004aad;
        color: white;
        padding: 15px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Personal Registration</h1>
      <p>Sign up with your personal email or your favorite social network</p>

      <div class="social-buttons">
        <button class="social-button facebook-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-facebook"
            viewBox="0 0 16 16"
            id="social"
          >
            <path
              d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
            />
          </svg>
          <i class="fab fa-facebook-f"></i> Log In with Facebook
        </button>
        <button class="social-button google-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-google"
            viewBox="0 0 16 16"
            id="social"
          >
            <path
              d="M15.545 6.558a9.4 9.4 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0a7.7 7.7 0 0 1 5.352 2.082l-2.284 2.284A4.35 4.35 0 0 0 8 3.166c-2.087 0-3.86 1.408-4.492 3.304a4.8 4.8 0 0 0 0 3.063h.003c.635 1.893 2.405 3.301 4.492 3.301 1.078 0 2.004-.276 2.722-.764h-.003a3.7 3.7 0 0 0 1.599-2.431H8v-3.08z"
            />
          </svg>
          <i class="fab fa-google"></i> Log In with Google
        </button>
        <button class="social-button twitter-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-twitter"
            viewBox="0 0 16 16"
            id="social"
          >
            <path
              d="M5.026 15c6.038 0 9.341-5.003 9.341-9.334q.002-.211-.006-.422A6.7 6.7 0 0 0 16 3.542a6.7 6.7 0 0 1-1.889.518 3.3 3.3 0 0 0 1.447-1.817 6.5 6.5 0 0 1-2.087.793A3.286 3.286 0 0 0 7.875 6.03a9.32 9.32 0 0 1-6.767-3.429 3.29 3.29 0 0 0 1.018 4.382A3.3 3.3 0 0 1 .64 6.575v.045a3.29 3.29 0 0 0 2.632 3.218 3.2 3.2 0 0 1-.865.115 3 3 0 0 1-.614-.057 3.28 3.28 0 0 0 3.067 2.277A6.6 6.6 0 0 1 .78 13.58a6 6 0 0 1-.78-.045A9.34 9.34 0 0 0 5.026 15"
            />
          </svg>
          <i class="fab fa-twitter"></i> Log In with Twitter
        </button>
      </div>
      <div><input type="checkbox">I accept the contract</div>
      <div class="icon-container">
        <a
         href={% url 'contratoPer' %}
          style="text-decoration: none; color: black"
        >
          <div style="font-size: 20px; align-items: center; text-align: center">
            Contract
          </div>
          <div class="icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              class="bi bi-file-earmark-text-fill"
              viewBox="0 0 16 16"
            >
              <path
                d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M4.5 9a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1zM4 10.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 1 0-1h4a.5.5 0 0 1 0 1z"
              />
            </svg>
            <i class="fas fa-file-alt"></i>
          </div>
        </a>
      </div>
      <div class="buttons-container" style="margin-top: 10px">
        <a href={% url 'registrarse' %} style="display: contents">
          <button type="button" class="back-button"><</button>
        </a>
        <a >
          <button class="next-button" onclick="window.location.href='http://127.0.0.1:8000/login/'">Sing up</button>
        </a>
      </div>
    </div>
  </body>
</html>
