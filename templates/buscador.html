<script>
    function togglePaisesEvent(){
        var paisInput = document.getElementById('pais');
        var estadosInput = document.getElementById('estadosInput');
        var regionesInput = document.getElementById('regionesInput');

        if (paisInput.value === 'selecciona'){
            estadosInput.classList.add('hidden');
            regionesInput.classList.add('hidden');
        }
        if (paisInput.value ==='usa'){
            estadosInput.classList.remove('hidden');
            regionesInput.classList.add('hidden');
        }
        if (paisInput.value === 'chile'){
            estadosInput.classList.add('hidden');
            regionesInput.classList.remove('hidden');
        }
    }
</script>
