{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">
    <style>
        .card-header-custom {
            background-color: #004AAD;
            color: white;
            border-color: #004AAD;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px;
            /* Ajustar la altura según sea necesario */
        }

        .etiqueta {
            color: white;
            font-size: 1.5rem;
            margin: 0;
        }

        .table tbody tr td {
            padding: 15px 0;
        }

        .tab-container {
            display: flex;
            position: relative;
            border-bottom: 2px solid #ccc;
        }

        .tab {
            display: none;
        }

        .tab_label {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .tab_label:hover {
            background-color: #f0f0f0;
        }

        .indicator {
            position: absolute;
            bottom: 0;
            height: 2px;
            background-color: #004AAD;
            transition: width 0.3s ease, left 0.3s ease;
        }

        .container {
            display: flex;
            height: calc(100vh - 50px);
        }

        .sidebar {
            width: 300px;
            background-color: #fff;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .contacts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #004AAD;
            color: white;
        }

        .contact-list {
            padding: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .contact-item:hover,
        .contact-item.active {
            background-color: #e9ecef;
        }

        .main-content {
            flex: 2;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
        }

        .current-recipient-header {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .message-list {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
        }

        .message-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .message-item.sent {
            justify-content: flex-end;
        }

        .message {
            max-width: 60%;
            padding: 10px;
            border-radius: 10px;
            background-color: #e9ecef;
        }

        .message-item.sent .message {
            background-color: #004AAD;
            color: white;
        }

        .message-input-container {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-top: 1px solid #ccc;
            background-color: white;
        }

        .message-input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-right: 10px;
        }

        .message-input-container .icon-button {
            margin-left: 10px;
            background-color: #004AAD;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }

        .message-input-container .icon-button:hover {
            background-color: #003580;
        }
    </style>
</head>

<body class="container-fluid mt-3 me-5">
    <div class="container-fluid me-5">
        {% include "navegacion.html" %}
    </div>
    <div class="container mt-5 me-5">
        <div class="row">
            <div class="sidebar col-md-4 col-lg-3">
                <div class="contacts-header">
                    <h2>NETChat</h2>
                    <button class="icon-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="M12 5v14" />
                        </svg>
                    </button>
                </div>
                <div id="contactList" class="contact-list"></div>
            </div>
            <div class="main-content col-md-8 col-lg-9">
                <div id="currentRecipientHeader" class="current-recipient-header"></div>
                <div id="messageList" class="message-list"></div>
                <div class="message-input-container">
                    <input id="messageInput" type="text" placeholder="Type a message..." />
                    <button id="sendMessageButton" class="icon-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 2L15 22L11 13L2 9" />
                            <path d="M22 2L11 13" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts al final del body -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-QzDgn0DRuMq15fXxBU3yb4tkB5a1lT6JlgLrjxgQDdT7z8OM7DFgJRo9OQmx0FOF" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const users = [
                { id: 1, firstName: "Camilo", lastName: "Torrealba", company: "Agricola Alto Traiguen SA" },
                { id: 2, firstName: "Marcos", lastName: "Huerta", company: "Alcia Servicios LTDA." },
                { id: 3, firstName: "Rene", lastName: "Araya", company: "Servicios de corta de madera" },
                { id: 4, firstName: "Maria", lastName: "Morales", company: "ADMINISTRADORA DE RESTAURANTES LIMITADA" },
                { id: 5, firstName: "Ana", lastName: "Maria", company: "AGENCIA PRIZE EMPRESA DE SERVICIOS TRANSITORIOS LIMITADA" },
                { id: 6, firstName: "Roberto", lastName: "Alvo", company: "LATAM Airlines Group" },
                { id: 7, firstName: "Matias", lastName: "Vidal", company: "Cencosud" },
            ];

            const messages = [
                { id: 1, senderId: 1, receiverId: 2, content: "Hello Fernando, can we talk about the details to confirm the shipment?" },
                { id: 2, senderId: 2, receiverId: 1, content: "Sure, let's have a meeting at 18:30" },
                { id: 3, senderId: 1, receiverId: 2, content: "Ok, I'll be waiting for the link, see you." },
            ];


            const autoReplies = {
                "Hello": "Hello! How can I help you today?",
                "Hello, I would like to order 90 kilos of lettuce": "Hello! Sure, could you please provide your address to coordinate the delivery?",
                "Good morning": "Good morning! How can I assist you?",
                "Good afternoon": "Good afternoon! How can I help you?",
                "How are you?": "Hello! I'm here to help. What do you need?",
                "What's up?": "Hello! I'm ready to answer your questions, how can I help you?",
                "Greetings": "Greetings! I'm here to assist you with whatever you need.",
                "Hello!": "Hello! How can I help you today?",
                "Hello, I would like to know more about a product": "Hello! Sure, I'd be happy to help you with whatever you need. Can you specify more?",
                "Hello, I am interested": "Hello! I'm glad to hear you're interested. What specific product or service are you interested in?",
                "I need wholesale sneakers": "Would you like to schedule a meeting for today at 18:00 so I can show you the available models?",
                "Yes, I would like to": "Perfect, I'll send you the meeting link.",
                "Hello, I have a question": "Hello! Of course, tell me what you'd like to know and I'll help you solve it.",
                "Hello, I need help": "Hello! I'm here to help you. How can I assist you?",
                "Hello, can you help me?": "Hello! Sure, I'd be happy to help you with whatever you need. How can I assist you?",
                "I need help with an order": "Hello! Sure, I'd be happy to help you with your order. What's your order number?",
                "Hello, how can I contact you?": "Hello! You can contact us through our email or by adding us to your contact list.",
                "Hello, what are your hours of operation?": "Hello! Our hours of operation are Monday to Friday, from 9:00 to 18:00.",
            };

            let currentUser = users[0];
            let currentRecipient = users[1];

            const contactList = document.getElementById('contactList');
            const messageList = document.getElementById('messageList');
            const currentRecipientHeader = document.getElementById('currentRecipientHeader');
            const messageInput = document.getElementById('messageInput');
            const sendMessageButton = document.getElementById('sendMessageButton');

            function renderContacts() {
                contactList.innerHTML = '';
                users.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.className = `contact-item ${user.id === currentRecipient.id ? 'active' : ''}`;
                    userElement.innerHTML = `
                        <div class="info">
                            <div class="name">${user.firstName} ${user.lastName}</div>
                            <div>${user.company}</div>
                        </div>
                    `;
                    userElement.addEventListener('click', () => {
                        currentRecipient = user;
                        renderMessages(); // Actualiza los mensajes al cambiar de contacto
                        renderContacts();
                        renderCurrentRecipientHeader();
                    });
                    contactList.appendChild(userElement);
                });
            }

            function renderMessages() {
                messageList.innerHTML = '';
                messages.forEach(message => {
                    if ((message.senderId === currentUser.id && message.receiverId === currentRecipient.id) ||
                        (message.senderId === currentRecipient.id && message.receiverId === currentUser.id)) {
                        const messageElement = document.createElement('div');
                        messageElement.className = `message-item ${message.senderId === currentUser.id ? 'sent' : ''}`;
                        messageElement.innerHTML = `
                            <div class="message">${message.content}</div>
                        `;
                        messageList.appendChild(messageElement);
                    }

                    // Verificar si el mensaje recibido tiene una respuesta automática predefinida y no ha sido respondido aún
                    if (message.senderId === currentRecipient.id && autoReplies.hasOwnProperty(message.content)) {
                        const alreadyReplied = messages.some(msg =>
                            msg.senderId === currentRecipient.id &&
                            msg.receiverId === currentUser.id &&
                            msg.content === autoReplies[message.content]
                        );
                        if (!alreadyReplied) {
                            setTimeout(() => {
                                const replyMessage = {
                                    id: messages.length + 1,
                                    senderId: currentRecipient.id,
                                    receiverId: currentUser.id,
                                    content: autoReplies[message.content],
                                    timestamp: new Date().toISOString(),
                                };
                                messages.push(replyMessage);
                                renderMessages();
                            }, 1000); // Simular respuesta después de 1 segundo
                        }
                    }
                });
            }

            function renderCurrentRecipientHeader() {
                currentRecipientHeader.innerHTML = `
                    <div class="info">
                        <div class="name">${currentRecipient.firstName} ${currentRecipient.lastName}</div>
                        <div>${currentRecipient.company}</div>
                    </div>
                `;
            }

            renderContacts();
            renderMessages();
            renderCurrentRecipientHeader();

            // Event listener para enviar mensaje al presionar Enter
            messageInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    sendMessage();
                }
            });

            // Event listener para enviar mensaje al hacer clic en el botón
            sendMessageButton.addEventListener('click', () => {
                sendMessage();
            });

            function sendMessage() {
                const messageContent = messageInput.value.trim();
                if (messageContent !== '') {
                    const newMessage = {
                        id: messages.length + 1,
                        senderId: currentUser.id,
                        receiverId: currentRecipient.id,
                        content: messageContent,
                        timestamp: new Date().toISOString(),
                    };
                    messages.push(newMessage);
                    renderMessages();
                    messageInput.value = '';

                    // Verificar si hay una respuesta automática predefinida para el mensaje enviado
                    if (autoReplies.hasOwnProperty(messageContent)) {
                        setTimeout(() => {
                            const replyMessage = {
                                id: messages.length + 1,
                                senderId: currentRecipient.id,
                                receiverId: currentUser.id,
                                content: autoReplies[messageContent],
                                timestamp: new Date().toISOString(),
                            };
                            messages.push(replyMessage);
                            renderMessages();
                        }, 1000); // Simular respuesta después de 1 segundo
                    }
                }
            }

            // Función para ajustar el tamaño del navbar según la palabra FUNCIONANDO 21-06-2024 1:04
            function redirectTo(url) {
                window.location.href = url;
            }

            function selectActiveTab() {
                const currentUrl = window.location.href;
                const tabs = document.querySelectorAll('.tab');
                tabs.forEach(tab => {
                    const tabUrl = tab.nextElementSibling.getAttribute('data-url');
                    if (currentUrl.includes(tab.value)) {
                        tab.checked = true;
                        updateIndicatorPosition(tab.nextElementSibling);
                    }
                });
            }

            function updateIndicatorPosition(label) {
                const indicator = document.querySelector('.indicator');
                const labelRect = label.getBoundingClientRect();
                const containerRect = label.parentNode.getBoundingClientRect();
                indicator.style.width = labelRect.width + 'px';
                indicator.style.left = (labelRect.left - containerRect.left) + 'px';
            }

            document.querySelectorAll('.tab_label').forEach(label => {
                label.addEventListener('click', () => {
                    const url = label.getAttribute('data-url');
                    redirectTo(url);
                    updateIndicatorPosition(label);
                });
            });

            window.onload = selectActiveTab;
            window.onresize = selectActiveTab;

        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>    
    
</body>

</html>
