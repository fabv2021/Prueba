<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Company</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f4f4f4;
        align-items: center;
        text-align: center;
      }

      .container {
        background-color: #fff;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        width: 500px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .section {
        margin-bottom: 30px;
      }

      .section-title {
        font-weight: bold;
        margin-bottom: 10px;
      }

      .list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .list-item {
        margin-bottom: 10px;
      }

      .list-item::before {
        content: "";
        display: inline-block;
        width: 20px;
        height: 20px;
        background-color: #ccc;
        border-radius: 50%;
        margin-right: 10px;
      }
      .register-button {
        padding: 15px 25px;
        border: none;
        border-radius: 5px;
        background-color: #004aad;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;

        width: 200px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Tell us about your company</h2>

      <div class="section">
        <h3 class="section-title">My company/business offers the following: </h3>
        <ul class="list">
          <a href={% url 'producto' %} style="display: contents">
            <button class="register-button">Products</button>
          </a>
          <a href={% url 'servicio' %} ><button class="register-button">Services</button></a>
          
        </ul>
      </div>
    </div>
  </body>
</html>
