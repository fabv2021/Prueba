<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    </head>
    <body class="container mt-5">
        <nav class="navbar navbar-expand-lg shadow">
            <div class="container-fluid">
                <a class="navbar-brand nav nav-tabs nav-link-active" href="" style="color:#4169E1">Registro</a>
                <button class="navbar-toggler" type="button" data-bs-toggler="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class=" nav nav-tabs navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="{% url 'login' %}" style="color:#4169E1">Login</a>                        
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card text-center shadow-lg card border-info mb-3" style="max-width:18 rem;">
                        <div class="card-header text-center">
                            <span><h6><strong>Para recuperar su contraseña. Por favor, indique su dirección de correo electrónico y siga las instrucciones que aparecerán en su bandeja de entrada.</strong></h6></span>
                        </div>
                        <div class="card-body">
                            <div class="card-text text-center">
                                <label for="recuperar" class="form-label"><strong>Dirección de Correo Electrónico</strong></label>
                                <input type="email" class="form-control text-center" id="recuperar" placeholder="name@example.com">
                            </div>
                            <div class="card-text mt-4">
                                <p class="d-inline-flex gap-1">
                                    <button class="btn btn-primary" type="button" data-bs-target="#mensaje" data-bs-toggle="collapse" aria-expanded="false">
                                        SEND EMAIL
                                    </button>
                                </p>
                            </div>
                            
                                <div class="collapse text-center" id="mensaje">
                                    <div class="card card-text">
                                       <h5><strong> Un correo ha sido enviado al correo registrado. Revise su bandeja de entrada</strong></h5>
                                    </div>
                                </div>
                          
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    </body>
</html>
